# vim:ft=kitty

# macOS-specific settings

# Option key behavior - pass to terminal instead of macOS special chars
macos_option_as_alt yes

# Quit behavior - don't confirm when closing
macos_quit_when_last_window_closed yes

# Better font rendering on macOS
macos_thicken_font 0.5

# Show/hide on cmd+option+kitty (optional, commented out)
# macos_show_window_title_in none

# Colorspace for better color accuracy
macos_colorspace srgb

# Font
font_family MesloLGS Nerd Font
font_size 13.0

# Shift+Enter → LF (so it survives tmux and triggers chat:newline in Claude Code)
map shift+enter send_text all \x0a

# macOS-style keyboard shortcuts
map cmd+k send_text all \x0c
map cmd+t launch --cwd=current --type=tab
map cmd+w close_tab
map cmd+n launch --cwd=current --type=os-window
map cmd+shift+[ previous_tab
map cmd+shift+] next_tab
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9

# Splits
enabled_layouts splits,stack
map cmd+d launch --location=hsplit --cwd=current
map cmd+shift+d launch --location=vsplit --cwd=current
map cmd+left  neighboring_window left
map cmd+right neighboring_window right
map cmd+up    neighboring_window up
map cmd+down  neighboring_window down

# Window appearance
window_padding_width 4
confirm_os_window_close 0

# Tab bar: minimal text drawn by tab_bar.py, colours in *-theme.auto.conf.
# Only the current session's tabs are shown (plus tabs outside any session).
tab_bar_edge bottom
tab_bar_style custom
active_tab_font_style bold
inactive_tab_font_style normal
tab_bar_min_tabs 1
tab_bar_margin_width 4.0
tab_bar_margin_height 4.0 2.0
tab_bar_filter session:~ or session:^$

# ctrl+b prefix, tmux-style: the next key runs one action and the mode ends.
# The tab bar shows PREFIX while it is active. ctrl+b twice sends ctrl+b to
# the program (tmux inside kitty, page up in nvim).
map --new-mode prefix --on-unknown end --on-action end ctrl+b
map --mode prefix ctrl+b send_key ctrl+b
map --mode prefix esc    pop_keyboard_mode

# Sessions: pick an open/saved session or a project, back to the previous one, save
map --mode prefix s launch --type=overlay ~/.config/kitty/scripts/pick-session
map --mode prefix b goto_session -1
map --mode prefix shift+s save_as_session --save-only --match=session:. .

# Fuzzy-find a window across all tabs and sessions, with a screen preview
map --mode prefix w launch --type=overlay ~/.config/kitty/scripts/pick-window

# Tabs
map --mode prefix t launch --cwd=current --type=tab
map --mode prefix n next_tab
map --mode prefix p previous_tab
map --mode prefix < move_tab_backward
map --mode prefix > move_tab_forward
map --mode prefix , set_tab_title
map --mode prefix 1 goto_tab 1
map --mode prefix 2 goto_tab 2
map --mode prefix 3 goto_tab 3
map --mode prefix 4 goto_tab 4
map --mode prefix 5 goto_tab 5
map --mode prefix 6 goto_tab 6
map --mode prefix 7 goto_tab 7
map --mode prefix 8 goto_tab 8
map --mode prefix 9 goto_tab 9

# Splits (| side by side, - one above the other), focus, resize, zoom
map --mode prefix | launch --location=vsplit --cwd=current
map --mode prefix - launch --location=hsplit --cwd=current
map --mode prefix h neighboring_window left
map --mode prefix j neighboring_window down
map --mode prefix k neighboring_window up
map --mode prefix l neighboring_window right
map --mode prefix shift+h resize_window narrower 5
map --mode prefix shift+j resize_window shorter 5
map --mode prefix shift+k resize_window taller 5
map --mode prefix shift+l resize_window wider 5
map --mode prefix z toggle_layout stack
map --mode prefix x close_window

# Move splits: { } swap with the previous/next split in the tab, ! breaks the
# split out into its own tab, m moves it into a tab picked from a list
map --mode prefix { move_window_backward
map --mode prefix } move_window_forward
map --mode prefix ! kitten break_split.py
map --mode prefix m detach_window ask

# Scrollback, command palette, reload
map --mode prefix [     show_scrollback
map --mode prefix enter show_scrollback
map --mode prefix :     command_palette
map --mode prefix ?     command_palette
map --mode prefix r     load_config_file

# Remote control of kitty
allow_remote_control yes
